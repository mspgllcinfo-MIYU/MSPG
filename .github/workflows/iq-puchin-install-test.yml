name: IQ Puchin Build

on:
  push:
    branches:
      - claude/iq-puchin-new
  workflow_dispatch: {}

jobs:
  build-install-test-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature (apksigner)
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"

      - name: Dump APK info (aapt)
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK"

      - name: Rename APK
        run: |
          set -e
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          DEST="app/build/outputs/apk/debug/IQ_PUCHIN_STEP5_ACTIVATE.apk"
          if [ ! -f "$SRC" ]; then
            echo "Expected APK not found at $SRC"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          cp "$SRC" "$DEST"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQ-PUCHIN-STEP5-ACTIVATE
          path: android/app/build/outputs/apk/debug/IQ_PUCHIN_STEP5_ACTIVATE.apk
          if-no-files-found: error
