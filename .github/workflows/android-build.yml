name: Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # マリたん用Gemini APIキーはVersion 2以降APKへ一切埋め込まない(Cloudflare
      # Worker経由に変更、GeminiSearchService.kt参照) — ビルドにキーは不要。
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: poicat-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ログイン不要でAPKを配布するためのGitHub Releases公開。Actions Artifact
      # (上のUpload debug APK)は90日で失効しGitHubログインが必要になるため、
      # 旦那さんのGalaxy等、GitHubアカウントを持たない相手へも「同じURLを1本
      # 送るだけ」で最新版を渡せるよう、公開リポジトリのGitHub Releaseへ
      # APKを固定タグ"latest-apk"で毎回上書き公開する。開発中の作業ブランチ
      # 等からの誤公開を避けるため、安定版ブランチ(claude/step-3-uouuf6)への
      # pushの時だけ実行する。gh CLIはGitHub Actionsのubuntu-latestランナーに
      # 標準搭載済みで、GH_TOKENにはこのジョブ自身のGITHUB_TOKEN(上のpermissions:
      # contents: writeで書き込み許可済み)を使うため、新しいSecretの追加は不要。
      # このAPKにはGemini APIキーが一切埋め込まれていない(Cloudflare Worker
      # 経由に変更済み、GeminiSearchService.kt参照)ため、ログイン不要で公開
      # しても秘密情報は漏洩しない。
      - name: Publish latest APK to GitHub Release
        if: github.ref == 'refs/heads/claude/step-3-uouuf6'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/POI.apk
          NOTES="最新のPOI debug APKです。
          commit ${{ github.sha }}
          GitHub Actions Run #${{ github.run_number }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh release view latest-apk --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-apk /tmp/POI.apk --repo "${{ github.repository }}" --clobber
            gh release edit latest-apk --repo "${{ github.repository }}" --title "POI 最新版" --notes "$NOTES"
          else
            gh release create latest-apk /tmp/POI.apk --repo "${{ github.repository }}" --title "POI 最新版" --notes "$NOTES"
          fi

      - name: Upload Room schema exports
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas
          if-no-files-found: error

      - name: Commit generated Room schema exports
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Add generated Room schema exports for this version [skip ci]"
            git push
          else
            echo "No schema changes to commit."
          fi
