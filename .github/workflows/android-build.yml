name: Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          # マリたん用Gemini APIキー。リポジトリシークレットGEMINI_API_KEYが未設定の
          # 場合は空文字列になり、ビルド自体は問題なく通る(アプリ側がキー未設定を
          # 検出してマリたんを無効表示にするだけ)。ORG_GRADLE_PROJECT_接頭辞は
          # Gradleがこの環境変数を自動的にプロジェクトプロパティGEMINI_API_KEYとして
          # 読み込むための規約。
          ORG_GRADLE_PROJECT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: poicat-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Room schema exports
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas
          if-no-files-found: error

      - name: Commit generated Room schema exports
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Add generated Room schema exports for this version [skip ci]"
            git push
          else
            echo "No schema changes to commit."
          fi
