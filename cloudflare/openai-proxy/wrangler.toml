name = "poicat-openai-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# OPENAI_API_KEY / GEMINI_API_KEY are intentionally NOT set here.
# They are stored as encrypted Worker secrets:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put GEMINI_API_KEY
[vars]
# 実際にPOI Androidアプリが使っているFirebaseプロジェクト(google-services.json
# のproject_id)に合わせた値。以前は別プロジェクト("miyuki-neko-ai")のIDが
# 入っており、このままではIDトークン検証(issuer/audience)が必ず失敗していた。
FIREBASE_PROJECT_ID = "miyuxai"
ALLOWED_MODELS = "gpt-4o-mini"
MAX_TOKENS_LIMIT = "1024"
RATE_LIMIT_PER_MINUTE = "20"
# マリたん(/v1/gemini/generate)専用の設定。クライアント側でモデルを選ばせず、
# ここで固定する(無料枠が最大のモデルを維持しやすくするため)。
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_RATE_LIMIT_PER_MINUTE = "15"
# uid制限(上記)を回避する「新しいuidの量産」的な乱用への補助的な多層防御。
# 家庭内Wi-Fiで複数端末から使う分には影響しない程度に緩めた値。
GEMINI_IP_RATE_LIMIT_PER_MINUTE = "30"

# Created via the Cloudflare Dashboard (Storage & Databases > KV).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a51b4c8f6f2641c3a4c22345d0f94196"

[observability]
enabled = true
