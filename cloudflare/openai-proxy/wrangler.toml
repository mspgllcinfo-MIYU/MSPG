name = "poicat-openai-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# OPENAI_API_KEY is intentionally NOT set here.
# It is stored as an encrypted Worker secret:
#   wrangler secret put OPENAI_API_KEY
[vars]
FIREBASE_PROJECT_ID = "miyuki-neko-ai"
ALLOWED_MODELS = "gpt-4o-mini"
MAX_TOKENS_LIMIT = "1024"
RATE_LIMIT_PER_MINUTE = "20"

# Created via `wrangler kv namespace create RATE_LIMIT_KV`.
# Replace "id" below with the id printed by that command.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
